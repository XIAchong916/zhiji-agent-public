<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1000" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c2701a"/>
    </marker>
  </defs>

  <rect width="920" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2330">知几 · 递归诊断结构图</text>
  <text x="460" y="54" text-anchor="middle" font-size="11" fill="#5b6b7b">对应 docs/METHOD.md §1–§4</text>

  <!-- ============ ① 单层分析机制 ============ -->
  <text x="40" y="90" font-size="13" font-weight="bold" fill="#1a2330">① 单层运行机制 —— 干预更新内部状态，实现位置迁移</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="105" width="100" height="70" rx="8" fill="#e3f0fd" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="90" y="138" font-weight="bold" fill="#10283b">系统</text>
    <text x="90" y="156" font-size="9" fill="#33485c">System</text>

    <rect x="186" y="105" width="100" height="70" rx="8" fill="#e3f0fd" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="236" y="138" font-weight="bold" fill="#10283b">对象(t)</text>
    <text x="236" y="156" font-size="9" fill="#33485c">Object</text>

    <rect x="332" y="105" width="180" height="70" rx="8" fill="#f2f8ff" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="422" y="123" font-size="11" font-weight="bold" fill="#1a5b8a">内部状态(t)</text>
    <text x="422" y="135" font-size="7.5" fill="#5b6b7b">Object.InternalState_t</text>
    <rect x="342" y="141" width="36" height="20" rx="4" fill="#fde8e8"/>
    <text x="360" y="155" font-size="11" font-weight="bold" fill="#c0392b">R</text>
    <rect x="383" y="141" width="36" height="20" rx="4" fill="#fdf3d8"/>
    <text x="401" y="155" font-size="11" font-weight="bold" fill="#b7791f">θ</text>
    <rect x="424" y="141" width="36" height="20" rx="4" fill="#ddeefe"/>
    <text x="442" y="155" font-size="11" font-weight="bold" fill="#2b6cb0">D</text>
    <rect x="465" y="141" width="36" height="20" rx="4" fill="#ede4fa"/>
    <text x="483" y="155" font-size="11" font-weight="bold" fill="#6b46c1">Ω</text>
    <text x="422" y="172" font-size="7.5" fill="#5b6b7b">目标参照 · 边界约束 · 主要能力 · 可行选择空间</text>

    <rect x="558" y="105" width="100" height="70" rx="8" fill="#fdeee0" stroke="#c2701a" stroke-width="1.5"/>
    <text x="608" y="133" font-weight="bold" fill="#7a3d0a">干预</text>
    <text x="608" y="150" font-size="9" fill="#8a4a10">Intervention</text>
    <text x="608" y="166" font-size="8" fill="#8a4a10">∈ Ω 可行空间</text>

    <rect x="704" y="105" width="180" height="70" rx="8" fill="#f2f8ff" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="794" y="123" font-size="11" font-weight="bold" fill="#1a5b8a">内部状态(t+1)</text>
    <text x="794" y="135" font-size="7.5" fill="#5b6b7b">Object.InternalState_t+1</text>
    <rect x="714" y="141" width="36" height="20" rx="4" fill="#fde8e8"/>
    <text x="732" y="155" font-size="11" font-weight="bold" fill="#c0392b">R</text>
    <rect x="755" y="141" width="36" height="20" rx="4" fill="#fdf3d8"/>
    <text x="773" y="155" font-size="11" font-weight="bold" fill="#b7791f">θ</text>
    <rect x="796" y="141" width="36" height="20" rx="4" fill="#ddeefe"/>
    <text x="814" y="155" font-size="11" font-weight="bold" fill="#2b6cb0">D</text>
    <rect x="837" y="141" width="36" height="20" rx="4" fill="#ede4fa"/>
    <text x="855" y="155" font-size="11" font-weight="bold" fill="#6b46c1">Ω</text>
    <text x="794" y="172" font-size="7.5" fill="#5b6b7b">目标参照 · 边界约束 · 主要能力 · 可行选择空间</text>
  </g>

  <!-- horizontal arrows with labels above row -->
  <line x1="140" y1="140" x2="186" y2="140" stroke="#2f6f9f" stroke-width="2" marker-end="url(#aB)"/>
  <text x="163" y="127" text-anchor="middle" font-size="8.5" fill="#2f6f9f">包含</text>
  <line x1="286" y1="140" x2="332" y2="140" stroke="#2f6f9f" stroke-width="2" marker-end="url(#aB)"/>
  <text x="309" y="127" text-anchor="middle" font-size="8.5" fill="#2f6f9f">具有</text>
  <line x1="512" y1="140" x2="558" y2="140" stroke="#2f6f9f" stroke-width="2" marker-end="url(#aB)"/>
  <text x="535" y="127" text-anchor="middle" font-size="8.5" fill="#2f6f9f">提供可干预变量</text>
  <line x1="658" y1="140" x2="704" y2="140" stroke="#2f6f9f" stroke-width="2" marker-end="url(#aB)"/>
  <text x="681" y="115" text-anchor="middle" font-size="8.5" fill="#2f6f9f">经 ChangeLaw<tspan x="681" dy="11">产生状态变化</tspan></text>

  <!-- dashed mapping arrows to positions -->
  <line x1="422" y1="175" x2="422" y2="211" stroke="#2f6f9f" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#aB)"/>
  <text x="430" y="196" font-size="8.5" fill="#5b6b7b">在系统中表现为位置（映射）</text>
  <line x1="794" y1="175" x2="794" y2="211" stroke="#2f6f9f" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#aB)"/>
  <text x="802" y="196" font-size="8.5" fill="#5b6b7b">在系统中表现为位置（映射）</text>

  <g text-anchor="middle">
    <rect x="332" y="215" width="180" height="60" rx="8" fill="#eef3fb" stroke="#3b6fb0" stroke-width="1.5"/>
    <text x="422" y="242" font-size="12" font-weight="bold" fill="#10283b">当前位置(t)</text>
    <text x="422" y="260" font-size="9" fill="#33485c">Position</text>

    <rect x="704" y="215" width="180" height="60" rx="8" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="794" y="242" font-size="12" font-weight="bold" fill="#14532d">新位置(t+1)</text>
    <text x="794" y="260" font-size="9" fill="#166534">New Position</text>
  </g>

  <!-- connector to section ② -->
  <text x="460" y="322" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a2330">同一套概念模型在五个业务尺度上递归复用</text>
  <text x="460" y="340" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6f9f">上层对象在下一层成为新系统：Layer(n).Object = Layer(n+1).System</text>
  <text x="460" y="357" text-anchor="middle" font-size="9.5" fill="#5b6b7b">每深入一层，问题空间严格缩小（递归是方式，逐层收敛是效果）</text>

  <!-- ============ ② 五层递归收敛与双向传导 ============ -->
  <text x="40" y="390" font-size="13" font-weight="bold" fill="#1a2330">② 五层递归收敛与双向传导</text>

  <!-- left rail: StatePackage downward -->
  <rect x="40" y="405" width="170" height="424" rx="10" fill="#f0f6fd" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="125" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5b8a">向下继承 · 保持分析连续</text>
  <line x1="55" y1="438" x2="195" y2="438" stroke="#c5d9ec" stroke-width="1"/>
  <g font-size="9" fill="#33485c" text-anchor="middle">
    <text x="125" y="458">封装为状态包 StatePackage</text>
    <text x="125" y="475">随对象一起进入下一层系统</text>
    <text x="125" y="498">状态参数（可参与干预推演）</text>
    <text x="125" y="515" font-weight="bold">R · θ · D · Ω</text>
    <text x="125" y="532">Ω 随关系变化重新收敛</text>
    <text x="125" y="555">只读基线（不可直接调整）</text>
    <text x="125" y="572">Position · ChangeLaw · Evidence</text>
    <text x="125" y="589">只能补充记录</text>
    <text x="125" y="606">不能覆盖已确认结果</text>
    <text x="125" y="629">涉及改变上层继承条件时</text>
    <text x="125" y="646">经向上反馈返回该层确认</text>
    <text x="125" y="663">变化仅属当前层时</text>
    <text x="125" y="680">经本层确认后重新封装</text>
  </g>

  <!-- right rail: Candidate Impact upward -->
  <rect x="710" y="405" width="170" height="424" rx="10" fill="#fdf6ef" stroke="#c2701a" stroke-width="1.2"/>
  <text x="795" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a4a10">向上反馈 · 影响传导</text>
  <line x1="725" y1="438" x2="865" y2="438" stroke="#ecd9c5" stroke-width="1"/>
  <g font-size="9" fill="#5b3d1a" text-anchor="middle">
    <text x="795" y="458">影响沿层级逐层向上</text>
    <text x="795" y="475">方案能力 → 场景</text>
    <text x="795" y="492">→ 业务 → 企业 → 行业</text>
    <text x="795" y="515">传递影响结果</text>
    <text x="795" y="532" font-weight="bold">而非状态覆盖</text>
    <text x="795" y="555">ΔInternalState / ΔPosition</text>
    <text x="795" y="572">作为上层候选影响</text>
    <text x="795" y="589">经上层确认才改写</text>
    <text x="795" y="606">可能放大 · 衰减</text>
    <text x="795" y="623">抵消 · 或在某层停止</text>
    <text x="795" y="646">不确认则保留原有状态</text>
    <text x="795" y="663">支持多轮试算与回退</text>
  </g>

  <!-- five layer bands -->
  <g>
    <rect x="240" y="405" width="440" height="64" rx="8" fill="#d3e6f3" stroke="#2f6f9f" stroke-width="1.2"/>
    <rect x="240" y="405" width="8" height="64" fill="#6ba3cf"/>
    <circle cx="272" cy="437" r="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="272" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f9f">1</text>
    <text x="296" y="432" font-size="13" font-weight="bold" fill="#10283b">行业 · Industry</text>
    <text x="296" y="452" font-size="9.5" fill="#33485c">行业层：宏观环境与产业格局</text>

    <rect x="240" y="495" width="440" height="64" rx="8" fill="#c2daed" stroke="#2f6f9f" stroke-width="1.2"/>
    <rect x="240" y="495" width="8" height="64" fill="#5b93c4"/>
    <circle cx="272" cy="527" r="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="272" y="532" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f9f">2</text>
    <text x="296" y="522" font-size="13" font-weight="bold" fill="#10283b">企业 · Enterprise</text>
    <text x="296" y="542" font-size="9.5" fill="#33485c">企业层：行业中的位置 · 目标与关键约束</text>

    <rect x="240" y="585" width="440" height="64" rx="8" fill="#b1cee7" stroke="#2f6f9f" stroke-width="1.2"/>
    <rect x="240" y="585" width="8" height="64" fill="#4b83b9"/>
    <circle cx="272" cy="617" r="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="272" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f9f">3</text>
    <text x="296" y="612" font-size="13" font-weight="bold" fill="#10283b">业务 · Business</text>
    <text x="296" y="632" font-size="9.5" fill="#33485c">业务层：哪些业务 / 价值流真正影响企业目标</text>

    <rect x="240" y="675" width="440" height="64" rx="8" fill="#a0c2e1" stroke="#2f6f9f" stroke-width="1.2"/>
    <rect x="240" y="675" width="8" height="64" fill="#3b73ae"/>
    <circle cx="272" cy="707" r="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="272" y="712" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f9f">4</text>
    <text x="296" y="702" font-size="13" font-weight="bold" fill="#10283b">场景 · Scenario</text>
    <text x="296" y="722" font-size="9.5" fill="#33485c">场景层：为什么处于此状态 · 哪些变量可干预</text>

    <rect x="240" y="765" width="440" height="64" rx="8" fill="#8fb6db" stroke="#2f6f9f" stroke-width="1.2"/>
    <rect x="240" y="765" width="8" height="64" fill="#2f6f9f"/>
    <circle cx="272" cy="797" r="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="272" y="802" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f9f">5</text>
    <text x="296" y="792" font-size="13" font-weight="bold" fill="#10283b">方案能力 · Solution Capability</text>
    <text x="296" y="812" font-size="9.5" fill="#33485c">方案层：需要建设 / 组合什么能力 · 如何验证</text>
  </g>

  <!-- bidirectional gap arrows -->
  <g stroke-width="2">
    <line x1="430" y1="471" x2="430" y2="493" stroke="#2f6f9f" marker-end="url(#aB)"/>
    <line x1="490" y1="493" x2="490" y2="471" stroke="#c2701a" stroke-dasharray="5,3" marker-end="url(#aO)"/>
    <line x1="430" y1="561" x2="430" y2="583" stroke="#2f6f9f" marker-end="url(#aB)"/>
    <line x1="490" y1="583" x2="490" y2="561" stroke="#c2701a" stroke-dasharray="5,3" marker-end="url(#aO)"/>
    <line x1="430" y1="651" x2="430" y2="673" stroke="#2f6f9f" marker-end="url(#aB)"/>
    <line x1="490" y1="673" x2="490" y2="651" stroke="#c2701a" stroke-dasharray="5,3" marker-end="url(#aO)"/>
    <line x1="430" y1="741" x2="430" y2="763" stroke="#2f6f9f" marker-end="url(#aB)"/>
    <line x1="490" y1="763" x2="490" y2="741" stroke="#c2701a" stroke-dasharray="5,3" marker-end="url(#aO)"/>
  </g>

  <!-- captions -->
  <text x="460" y="856" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a2330">双向递归的核心：向下不断收敛到可执行干预点，向上持续关联判断整体价值</text>
  <text x="460" y="874" text-anchor="middle" font-size="9.5" fill="#5b6b7b">局部改善 ≠ 企业价值 —— 下层变化需逐层向上评估，经上层确认后才构成整体价值判断</text>

  <!-- agents: three cards -->
  <g>
    <!-- card 1: 业务诊断 Agent -->
    <rect x="40" y="884" width="270" height="76" rx="10" fill="#fbfdff" stroke="#bcd7ee" stroke-width="1.2"/>
    <circle cx="63" cy="907" r="12" fill="#2f6f9f"/>
    <circle cx="62.5" cy="906" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="66" y1="909.5" x2="70" y2="913.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="81" y="911" font-size="11" font-weight="bold" fill="#1a5b8a">业务诊断 Agent</text>
    <rect x="181" y="899" width="84" height="17" rx="8.5" fill="#e3f0fd"/>
    <text x="223" y="911" text-anchor="middle" font-size="7.5" fill="#2f6f9f">运行层级：1→2→3</text>
    <text x="52" y="938" font-size="8.5" fill="#44586a">宏观环境、产业格局、企业目标、经营状况、</text>
    <text x="52" y="952" font-size="8.5" fill="#44586a">业务体系、价值链</text>

    <!-- card 2: 场景诊断 Agent -->
    <rect x="325" y="884" width="270" height="76" rx="10" fill="#fbfdff" stroke="#bcd7ee" stroke-width="1.2"/>
    <circle cx="348" cy="907" r="12" fill="#2f6f9f"/>
    <path d="M348,901.2 l5,2.9 v5.8 l-5,2.9 l-5,-2.9 v-5.8 Z M343,904.1 l5,2.9 l5,-2.9 M348,907 v5.8" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="366" y="911" font-size="11" font-weight="bold" fill="#1a5b8a">场景诊断 Agent</text>
    <rect x="466" y="899" width="64" height="17" rx="8.5" fill="#e3f0fd"/>
    <text x="498" y="911" text-anchor="middle" font-size="7.5" fill="#2f6f9f">运行层级：4</text>
    <text x="337" y="945" font-size="8.5" fill="#44586a">应用场景、上下游流程与痛点</text>

    <!-- card 3: 方案设计 Agent -->
    <rect x="610" y="884" width="270" height="76" rx="10" fill="#fbfdff" stroke="#bcd7ee" stroke-width="1.2"/>
    <circle cx="633" cy="907" r="12" fill="#2f6f9f"/>
    <circle cx="633" cy="907" r="3.2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round">
      <line x1="633" y1="900.5" x2="633" y2="898.5"/>
      <line x1="633" y1="913.5" x2="633" y2="915.5"/>
      <line x1="626.5" y1="907" x2="624.5" y2="907"/>
      <line x1="639.5" y1="907" x2="641.5" y2="907"/>
      <line x1="628.4" y1="902.4" x2="627" y2="901"/>
      <line x1="637.6" y1="911.6" x2="639" y2="913"/>
      <line x1="628.4" y1="911.6" x2="627" y2="913"/>
      <line x1="637.6" y1="902.4" x2="639" y2="901"/>
    </g>
    <text x="651" y="911" font-size="11" font-weight="bold" fill="#1a5b8a">方案设计 Agent</text>
    <rect x="751" y="899" width="64" height="17" rx="8.5" fill="#e3f0fd"/>
    <text x="783" y="911" text-anchor="middle" font-size="7.5" fill="#2f6f9f">运行层级：5</text>
    <text x="622" y="945" font-size="8.5" fill="#44586a">可执行方案与能力组件</text>
  </g>

  <!-- source note -->
  <text x="40" y="988" font-size="8.5" fill="#7a8794">图源：docs/METHOD.md §1–§4</text>
</svg>
